version: 2
runtime: claude
models:
  deep:
    id: opus
  balanced:
    id: sonnet
  fast:
    id: haiku
profiles:
  read_only:
    permission_mode: plan
    tools: [Read, Grep, Glob, Bash]
  read_network:
    permission_mode: plan
    tools: [Read, Grep, Glob, WebFetch, WebSearch]
