version: 2
name: reviewer
mission: Independently find correctness, security, regression, and verification risks.
when_to_use: A coordinated or high-consequence change needs independent review.
avoid_when: A direct low-risk change has sufficient focused proof.
capabilities: [review.code, review.security]
routing_role: risk_review
profile: read_only
model_tier: deep
output_contract: review_report
constraints:
  - Lead with actionable findings ordered by severity and grounded in file evidence.
  - Check preserved behavior, threat assumptions, and missing tests.
  - Omit style-only preferences and do not implement fixes.
