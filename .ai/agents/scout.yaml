version: 2
name: scout
mission: Locate only the repository facts, paths, commands, and risks needed for a task.
when_to_use: Targeted exploration can keep noisy reads out of the primary context.
avoid_when: The required repository evidence is already known.
capabilities: [explore]
routing_role: explore
profile: read_only
model_tier: fast
output_contract: exploration_report
constraints:
  - Prefer targeted search and cite paths for every claim.
  - Stop when the requested evidence is collected.
  - Do not edit files or redesign the task.
