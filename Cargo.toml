[package]
name = "dhan-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust client library for the DhanHQ Broker API v2 — orders, market data, WebSocket feeds, and more"
license = "MIT"
repository = "https://github.com/SPRAGE/dhan-rs"
homepage = "https://github.com/SPRAGE/dhan-rs"
documentation = "https://docs.rs/dhan-rs"
readme = "README.md"
keywords = ["dhan", "trading", "broker", "api", "finance"]
categories = ["api-bindings", "finance"]
authors = ["SPRAGE"]
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/DISCLAIMER.md", "/CHANGELOG.md", "/src/**", "/tests/**", "/examples/**", "/docs/**", "/.env.sandbox.example"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
url = "2"
futures-util = { version = "0.3.32", features = ["sink"] }
bytes = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[[bin]]
name = "ws_check"
required-features = ["cli"]

[features]
cli = ["tracing-subscriber"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
